name: release

# Publishing a GitHub Release (tag like v0.2.0) builds the Windows installer,
# signs the update, and attaches the installer, its signature and latest.json
# to that release. Running apps check latest.json and offer the update.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Libclang for the embedded model runtime
        shell: pwsh
        run: |
          python -m pip install --target target/intake-tooling libclang==18.1.1
          "LIBCLANG_PATH=$pwd/target/intake-tooling/clang/native" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
      - name: Take the version from the release tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v="${TAG#v}"
          echo "Releasing $v"
          sed -i -E "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          node -e "for (const f of ['apps/desktop/src-tauri/tauri.conf.json','apps/desktop/package.json']) { const fs=require('fs'); const j=JSON.parse(fs.readFileSync(f,'utf8')); j.version='$v'; fs.writeFileSync(f, JSON.stringify(j,null,2)+'\n'); }"
      - name: Build the background service
        shell: bash
        run: |
          cargo build --release -p arbiterd -p arbiter-mcp
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/arbiterd.exe apps/desktop/src-tauri/binaries/arbiterd-x86_64-pc-windows-msvc.exe
          cp target/release/arbiter-mcp.exe apps/desktop/src-tauri/binaries/arbiter-mcp-x86_64-pc-windows-msvc.exe
      - run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Build, sign and attach the installer and update
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          includeUpdaterJson: true
